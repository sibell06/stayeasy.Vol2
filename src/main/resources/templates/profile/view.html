<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('My Profile')}"/>
</head>
<body>

<th:block th:replace="~{fragments/layout :: navbar}"/>

<main>
    <div class="form-container" style="max-width:500px;">
        <h1>My Profile</h1>

        <div class="form-group">
            <label>Username</label>
            <p th:text="${profileUser.username}"></p>
        </div>

        <div class="form-group">
            <label>Email</label>
            <p th:text="${profileUser.email}"></p>
        </div>

        <div class="form-group">
            <label>First Name</label>
            <p th:text="${profileUser.firstName} ?: '—'"></p>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <p th:text="${profileUser.lastName} ?: '—'"></p>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <p th:text="${profileUser.phoneNumber} ?: '—'"></p>
        </div>

        <div class="form-group">
            <label>Role</label>
            <p th:text="${profileUser.role}"></p>
        </div>

        <a th:href="@{/profile/edit}" class="btn btn-primary" style="width:100%; text-align:center; display:block;">
            Edit Profile
        </a>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: footer}"/>

</body>
</html>
